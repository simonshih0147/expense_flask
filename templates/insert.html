<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>新增消費資料</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='form.css') }}">
</head>

<body>

<div class="page-container">

    <div class="form-card">

        <h1 class="page-title">新增消費資料</h1>

        <div class="page-subtitle">
            Personal Expense Entry
        </div>

        <form action="/insert" method="POST">

            <div class="form-grid">

                <div class="form-group full-width">
                    <label>日期</label>
                    <input type="datetime-local"
                           name="日期"
                           required>
                </div>

                <div class="form-group">
                    <label>交通費</label>
                    <input type="number" name="交通費" value="0" min="0">
                </div>

                <div class="form-group">
                    <label>電話費</label>
                    <input type="number" name="電話費" value="0" min="0">
                </div>

                <div class="form-group">
                    <label>房貸</label>
                    <input type="number" name="房貸" value="0" min="0">
                </div>

                <div class="form-group">
                    <label>用餐</label>
                    <input type="number" name="用餐" value="0" min="0">
                </div>

                <div class="form-group">
                    <label>保險</label>
                    <input type="number" name="保險" value="0" min="0">
                </div>

                <div class="form-group">
                    <label>醫療</label>
                    <input type="number" name="醫療" value="0" min="0">
                </div>

                <div class="form-group">
                    <label>水費</label>
                    <input type="number" name="水費" value="0" min="0">
                </div>

                <div class="form-group">
                    <label>電費</label>
                    <input type="number" name="電費" value="0" min="0">
                </div>

                <div class="form-group">
                    <label>瓦斯費</label>
                    <input type="number" name="瓦斯費" value="0" min="0">
                </div>

                <div class="form-group">
                    <label>其他</label>
                    <input type="number" name="其他" value="0" min="0">
                </div>

                <div class="form-group">
                    <label>加油費</label>
                    <input type="number" name="加油費" value="0" min="0">
                </div>

                <div class="form-group">
                    <label>稅費</label>
                    <input type="number" name="稅費" value="0" min="0">
                </div>

                <div class="form-group">
                    <label>有線電視</label>
                    <input type="number" name="有線電視" value="0" min="0">
                </div>

                <div class="form-group">
                    <label>照顧家人</label>
                    <input type="number" name="照顧家人" value="0" min="0">
                </div>

                <div class="form-group full-width">
                    <label>備註</label>
                    <input type="text"
                           name="備註"
                           maxlength="255"
                           placeholder="例如：家庭聚餐、醫療用品等">
                </div>

            </div>

            <div class="button-area">

                <button type="submit"
                        class="btn btn-primary">
                    新增資料
                </button>

                <a href="/"
                   class="btn btn-secondary">
                    回首頁
                </a>

            </div>

        </form>

    </div>

</div>

</body>
</html>
