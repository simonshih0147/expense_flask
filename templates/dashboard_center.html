<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>個人消費記帳及統計｜統計分析中心 V5.4</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f5fa;color:#173453;font-family:"Microsoft JhengHei",Arial,sans-serif}
.wrap{max-width:1440px;margin:0 auto;padding:18px}
header{background:#fff;border-radius:14px;padding:18px 22px;box-shadow:0 3px 16px #1c3d5912}
h1{margin:0 0 8px;font-size:26px}p{margin:6px 0;color:#5c6c7f}
nav{display:flex;flex-wrap:wrap;gap:12px;margin-top:14px}
nav a{color:#1768b4;text-decoration:none;font-weight:600}
.tabs{display:flex;flex-wrap:wrap;gap:10px;margin:18px 0}
.tab{font:inherit;font-weight:700;border:1px solid #b7c9de;background:white;border-radius:10px;padding:12px 18px;cursor:pointer;color:#254766}
.tab[aria-selected="true"]{background:#1768b4;color:white;border-color:#1768b4}
.panel{background:white;border-radius:14px;overflow:hidden;box-shadow:0 3px 16px #1c3d5912}
.panel[hidden]{display:none}
.panel-head{display:flex;justify-content:space-between;align-items:center;padding:12px 18px;border-bottom:1px solid #e6ecf4;gap:10px;flex-wrap:wrap}
.panel-head a{color:#1768b4}
iframe{width:100%;height:1050px;border:0;background:#fff}
@media(max-width:700px){iframe{height:1150px}h1{font-size:22px}.tab{flex:1}}
</style>
</head>
<body><main class="wrap">
<header>
<h1>個人消費記帳及統計｜統計分析中心 V5.4</h1>
<p>在同一個操作畫面切換 V5.2 綜合統計與 V5.3 跨年及分類分析；沿用原有資料庫。</p>
<nav><a href="/">系統首頁</a><a href="/insert">逐筆新增</a><a href="/query">消費查詢</a><a href="/dashboard">原 Dashboard</a><a href="/database-backup/">一鍵備份 MySQL</a><a href="/auto/">自動化記帳</a><a href="/auto/add">自動化逐筆新增</a><a href="/auto/import">Excel 批次匯入</a></nav>
</header>
<div class="tabs" role="tablist" aria-label="統計分析功能">
<button class="tab" id="tab-v52" type="button" role="tab" aria-controls="panel-v52" aria-selected="true" onclick="showTab('v52')">V5.2 綜合統計</button>
<button class="tab" id="tab-auto" type="button" role="tab" aria-controls="panel-auto" aria-selected="false" onclick="showTab('auto')">自動化記帳／批次匯入</button>
<button class="tab" id="tab-v53" type="button" role="tab" aria-controls="panel-v53" aria-selected="false" onclick="showTab('v53')">V5.3 跨年與分類分析</button>
</div>
<section id="panel-v52" class="panel" role="tabpanel" aria-labelledby="tab-v52">
<div class="panel-head"><strong>V5.2｜綜合統計</strong><a href="/dashboard-v5" target="_blank" rel="noopener">獨立視窗開啟 V5.2</a></div>
<iframe title="Dashboard V5.2" src="/dashboard-v5" loading="eager"></iframe>
</section>
<section id="panel-v53" class="panel" role="tabpanel" aria-labelledby="tab-v53" hidden>
<div class="panel-head"><strong>V5.3｜跨年趨勢、消費項目柏拉圖</strong><a href="/dashboard-v53" target="_blank" rel="noopener">獨立視窗開啟 V5.3</a></div>
<iframe id="v53-frame" title="Dashboard V5.3" data-src="/dashboard-v53" loading="lazy"></iframe>
</section>
<section id="panel-auto" class="panel" role="tabpanel" aria-labelledby="tab-auto" hidden>
<div class="panel-head"><strong>自動化記帳｜逐筆新增與 Excel / CSV 批次匯入</strong><div><a href="#auto" onclick="loadAuto('/auto/');return false">自動化首頁</a>　<a href="#auto" onclick="loadAuto('/auto/add');return false">逐筆新增</a>　<a href="#auto" onclick="loadAuto('/auto/import');return false">批次匯入</a>　<a href="/auto/" target="_blank" rel="noopener">獨立開啟</a></div></div>
<iframe id="auto-frame" title="自動化記帳" data-src="/auto/" loading="lazy"></iframe>
</section>
</main>
<script>
function showTab(which){
  for(const name of ['v52','v53','auto']){
    const active=name===which;
    document.getElementById('tab-'+name).setAttribute('aria-selected',String(active));
    document.getElementById('panel-'+name).hidden=!active;
  }
  const frame=document.getElementById('v53-frame');
  if(which==='v53' && !frame.src) frame.src=frame.dataset.src;
  const autoFrame=document.getElementById('auto-frame');
  if(which==='auto' && !autoFrame.src) autoFrame.src=autoFrame.dataset.src;
  if(history.replaceState) history.replaceState(null,'','#'+which);
}
function loadAuto(path){showTab('auto');document.getElementById('auto-frame').src=path;}
showTab(location.hash==='#auto'?'auto':location.hash==='#v53'?'v53':'v52');
</script>
</body></html>
